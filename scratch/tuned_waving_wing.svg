<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="wave_grad" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F7F1E6"/>
      <stop offset="80%" stop-color="#E9D6BE"/>
      <stop offset="100%" stop-color="#CFA883"/>
    </linearGradient>
    <linearGradient id="feather_highlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFDF9" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="feather_shadow" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#BA9875" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#B28E69" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9C7752" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <image href="panel_4_aligned.png" width="1024" height="1024" opacity="0.4"/>

  <!-- Master Waving Wing Path -->
  <g id="waving_wing">
    <!-- Base 3-lobed contour -->
    <path id="waving_wing_body" d="
      M 742,420
      C 752,350 798,245 852,175
      C 868,154 892,164 896,188
      C 900,215 892,250 896,265
      C 900,280 918,258 936,242
      C 952,228 970,240 968,264
      C 966,288 950,320 954,338
      C 958,354 978,348 984,364
      C 992,388 984,420 966,450
      C 938,498 898,565 842,630
      C 798,680 762,714 748,720
      C 736,698 728,620 728,550
      C 728,485 736,445 742,420 Z"
      fill="url(#wave_grad)"
      stroke="#D6C0A6" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Crease 1: between primary and middle feather -->
    <path d="M 896,265 C 888,295 870,350 848,395 C 832,428 815,458 800,480"
      fill="none" stroke="url(#feather_shadow)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Crease 2: between middle and lower feather -->
    <path d="M 954,338 C 938,370 915,420 888,468 C 866,505 844,535 824,558"
      fill="none" stroke="url(#feather_shadow)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Primary Feather Top Highlight -->
    <path d="M 765,335 C 802,248 845,185 864,172 C 876,164 888,172 892,190"
      fill="none" stroke="url(#feather_highlight)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Middle Feather Highlight -->
    <path d="M 906,270 C 922,252 938,240 948,238 C 958,236 964,244 964,258"
      fill="none" stroke="url(#feather_highlight)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>