<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #0B0F17; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #lottie-container { width: 512px; height: 512px; }
  </style>
  <script src="/scratch/lottie.min.js"></script>
</head>
<body>
  <div id="lottie-container"></div>
  <pre id="debug"></pre>
  <script>
    fetch('/scratch/aituko_lottie_3d_master.json')
      .then(res => res.json())
      .then(animData => {
        window.anim = lottie.loadAnimation({
          container: document.getElementById('lottie-container'),
          renderer: 'svg',
          loop: false,
          autoplay: false,
          animationData: animData
        });
        window.anim.addEventListener('DOMLoaded', function() {
          const svg = document.querySelector('svg');
          document.getElementById('debug').innerText = svg ? ('SVG viewBox: ' + svg.getAttribute('viewBox') + ', childCount: ' + svg.children.length + ', html: ' + svg.innerHTML.substring(0, 500)) : 'NO SVG';
        });
      })
      .catch(err => {
        document.getElementById('debug').innerText = 'FETCH ERR: ' + err.message;
      });
  </script>
</body>
</html>
