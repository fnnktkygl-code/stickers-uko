<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background: transparent;">
  <defs>
    <!-- Master Body Gradient -->
    <linearGradient id="bodyGrad" x1="28%" y1="6%" x2="72%" y2="94%">
      <stop offset="0%" stop-color="#E5DDD5" />
      <stop offset="18%" stop-color="#DDD5CD" />
      <stop offset="42%" stop-color="#D4C9BD" />
      <stop offset="65%" stop-color="#BAABA0" />
      <stop offset="85%" stop-color="#9E8C7F" />
      <stop offset="100%" stop-color="#736151" />
    </linearGradient>

    <!-- Cranial Highlight -->
    <radialGradient id="cranialHl" cx="42%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#F5EFEA" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#DED6CE" stop-opacity="0" />
    </radialGradient>

    <!-- Chest Soft Illumination -->
    <radialGradient id="chestHl" cx="44%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ECE5DC" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#DED6CE" stop-opacity="0" />
    </radialGradient>

    <!-- Wing Shadow -->
    <linearGradient id="rWingShadow" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#C5B8AC" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8E7E70" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#554436" stop-opacity="0.85" />
    </linearGradient>

    <!-- Left Wing Rim -->
    <linearGradient id="lWingRim" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#E5DDD5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E5DDD5" stop-opacity="0" />
    </linearGradient>

    <!-- Left Eye Radial -->
    <radialGradient id="amberEyeL" cx="28%" cy="72%" r="72%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="28%" stop-color="#D99B26" />
      <stop offset="62%" stop-color="#8A4807" />
      <stop offset="86%" stop-color="#2D1302" />
      <stop offset="100%" stop-color="#150800" />
    </radialGradient>

    <!-- Right Eye Radial -->
    <radialGradient id="amberEyeR" cx="72%" cy="72%" r="72%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="28%" stop-color="#D99B26" />
      <stop offset="62%" stop-color="#8A4807" />
      <stop offset="86%" stop-color="#2D1302" />
      <stop offset="100%" stop-color="#150800" />
    </radialGradient>

    <!-- Pupil -->
    <radialGradient id="pupilGrad" cx="42%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#080402" />
      <stop offset="75%" stop-color="#180A03" />
      <stop offset="100%" stop-color="#2C1204" />
    </radialGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D5C5B5" />
      <stop offset="35%" stop-color="#B89B82" />
      <stop offset="70%" stop-color="#9E7E65" />
      <stop offset="100%" stop-color="#6E503A" />
    </linearGradient>

    <!-- Toe Gradients -->
    <linearGradient id="toeGradL" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E0D2C4" />
      <stop offset="40%" stop-color="#BCA896" />
      <stop offset="80%" stop-color="#8C7460" />
      <stop offset="100%" stop-color="#5C4635" />
    </linearGradient>
    <linearGradient id="toeGradR" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D2C4B5" />
      <stop offset="40%" stop-color="#A89482" />
      <stop offset="80%" stop-color="#7C6652" />
      <stop offset="100%" stop-color="#4C3828" />
    </linearGradient>

    <!-- Master Body Clip -->
    <clipPath id="bodyClip">
      <path d="M 213 46 L 191 55 L 167 71 L 149 90 L 149 92 L 138 107 L 138 110 L 136 111 L 133 120 L 130 124 L 125 142 L 123 144 L 118 173 L 112 177 L 108 188 L 100 199 L 96 214 L 94 216 L 90 236 L 88 254 L 88 301 L 94 338 L 96 340 L 100 353 L 103 356 L 102 357 L 107 363 L 107 365 L 113 371 L 117 372 L 123 377 L 124 376 L 129 381 L 136 391 L 136 393 L 140 396 L 140 398 L 158 416 L 160 416 L 170 424 L 181 429 L 189 435 L 189 444 L 184 457 L 180 461 L 171 462 L 169 464 L 164 465 L 158 472 L 156 479 L 157 488 L 163 488 L 165 490 L 183 489 L 185 491 L 204 491 L 227 488 L 229 490 L 235 489 L 235 485 L 231 487 L 230 486 L 230 474 L 220 462 L 220 457 L 216 456 L 216 450 L 220 442 L 265 443 L 275 442 L 277 440 L 282 440 L 284 442 L 290 440 L 292 442 L 293 441 L 298 448 L 297 460 L 294 461 L 294 464 L 291 467 L 283 471 L 280 477 L 280 481 L 276 484 L 278 488 L 281 487 L 286 490 L 346 490 L 353 484 L 353 473 L 347 466 L 337 464 L 330 459 L 325 448 L 324 434 L 329 429 L 333 428 L 336 423 L 347 418 L 358 407 L 367 401 L 367 399 L 384 379 L 387 373 L 400 370 L 412 350 L 419 329 L 423 299 L 423 255 L 417 216 L 415 214 L 414 207 L 407 192 L 401 185 L 402 184 L 400 182 L 399 177 L 393 171 L 388 147 L 386 145 L 383 129 L 374 112 L 374 109 L 360 90 L 360 88 L 346 73 L 320 55 L 292 45 L 274 42 L 237 42 Z" />
    </clipPath>
  </defs>

  <!-- 1. Master Body Silhouette (Exact IoU >= 99%) -->
  <path d="M 213 46 L 191 55 L 167 71 L 149 90 L 149 92 L 138 107 L 138 110 L 136 111 L 133 120 L 130 124 L 125 142 L 123 144 L 118 173 L 112 177 L 108 188 L 100 199 L 96 214 L 94 216 L 90 236 L 88 254 L 88 301 L 94 338 L 96 340 L 100 353 L 103 356 L 102 357 L 107 363 L 107 365 L 113 371 L 117 372 L 123 377 L 124 376 L 129 381 L 136 391 L 136 393 L 140 396 L 140 398 L 158 416 L 160 416 L 170 424 L 181 429 L 189 435 L 189 444 L 184 457 L 180 461 L 171 462 L 169 464 L 164 465 L 158 472 L 156 479 L 157 488 L 163 488 L 165 490 L 183 489 L 185 491 L 204 491 L 227 488 L 229 490 L 235 489 L 235 485 L 231 487 L 230 486 L 230 474 L 220 462 L 220 457 L 216 456 L 216 450 L 220 442 L 265 443 L 275 442 L 277 440 L 282 440 L 284 442 L 290 440 L 292 442 L 293 441 L 298 448 L 297 460 L 294 461 L 294 464 L 291 467 L 283 471 L 280 477 L 280 481 L 276 484 L 278 488 L 281 487 L 286 490 L 346 490 L 353 484 L 353 473 L 347 466 L 337 464 L 330 459 L 325 448 L 324 434 L 329 429 L 333 428 L 336 423 L 347 418 L 358 407 L 367 401 L 367 399 L 384 379 L 387 373 L 400 370 L 412 350 L 419 329 L 423 299 L 423 255 L 417 216 L 415 214 L 414 207 L 407 192 L 401 185 L 402 184 L 400 182 L 399 177 L 393 171 L 388 147 L 386 145 L 383 129 L 374 112 L 374 109 L 360 90 L 360 88 L 346 73 L 320 55 L 292 45 L 274 42 L 237 42 Z" fill="url(#bodyGrad)" />

  <!-- 2. Clipped 3D Surface Overlays -->
  <g clip-path="url(#bodyClip)">
    <!-- Cranial Specular Dome -->
    <ellipse cx="250" cy="115" rx="145" ry="90" fill="url(#cranialHl)" />
    
    <!-- Chest Illumination -->
    <ellipse cx="245" cy="285" rx="110" ry="85" fill="url(#chestHl)" />

    <!-- Right Flank Ambient Occlusion -->
    <path d="M 330 200 C 380 230, 424 290, 412 380 C 395 435, 360 455, 335 440 C 365 390, 370 300, 330 200 Z" fill="url(#rWingShadow)" />

    <!-- Left Flank Rim Highlight -->
    <path d="M 160 210 C 115 240, 92 290, 98 380 C 110 425, 135 445, 155 435 C 135 385, 135 300, 160 210 Z" fill="url(#lWingRim)" />

    <!-- Beak Cast Shadow -->
    <ellipse cx="256" cy="225" rx="16" ry="7" fill="#423022" opacity="0.35" />
  </g>

  <!-- 3. Eye Sockets & Amber Eyes -->
  <!-- Left Eye -->
  <g id="left_eye">
    <!-- Socket Outer Crevice -->
    <circle cx="195" cy="155" r="27.5" fill="#402C1B" opacity="0.75" />
    <circle cx="195" cy="155" r="25.5" fill="#201004" />
    <!-- Amber Iris -->
    <circle cx="195" cy="155" r="24" fill="url(#amberEyeL)" />
    <!-- Pupil -->
    <circle cx="199" cy="149" r="13" fill="url(#pupilGrad)" />
    <!-- Specular Glints -->
    <ellipse cx="190" cy="149" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="202" cy="161" r="1.8" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- Right Eye -->
  <g id="right_eye">
    <!-- Socket Outer Crevice -->
    <circle cx="311" cy="155" r="27.5" fill="#402C1B" opacity="0.75" />
    <circle cx="311" cy="155" r="25.5" fill="#201004" />
    <!-- Amber Iris -->
    <circle cx="311" cy="155" r="24" fill="url(#amberEyeR)" />
    <!-- Pupil -->
    <circle cx="305" cy="149" r="13" fill="url(#pupilGrad)" />
    <!-- Specular Glints -->
    <ellipse cx="306" cy="149" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="318" cy="161" r="1.8" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- 4. Beak (Porcelain Amber) -->
  <g id="beak">
    <path d="M 256 168 C 267 184, 268 206, 256 218 C 244 206, 245 184, 256 168 Z" fill="url(#beakGrad)" stroke="#4A3220" stroke-width="1.2" />
    <!-- Beak Ridge Highlight -->
    <path d="M 256 172 C 259 184, 259 200, 256 212" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45" fill="none" />
  </g>

  <!-- 5. Grounded Feet with 3 Rounded Toes (Resting Y in [450, 492]) -->
  <g id="feet">
    <!-- Left Foot -->
    <g id="left_foot">
      <!-- Outer Toe 1 -->
      <path d="M 158 472 C 158 460, 180 460, 182 472 L 183 490 L 158 490 Z" fill="url(#toeGradL)" />
      <!-- Middle Toe 2 -->
      <path d="M 181 462 C 181 448, 207 448, 208 462 L 209 491 L 181 491 Z" fill="url(#toeGradL)" />
      <!-- Inner Toe 3 -->
      <path d="M 207 468 C 207 456, 233 456, 234 468 L 235 490 L 207 490 Z" fill="url(#toeGradL)" />

      <!-- Toe Crevices (Ambient Shadows) -->
      <path d="M 181 464 L 182 490" stroke="#25170B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 207 466 L 208 490" stroke="#25170B" stroke-width="2.5" stroke-linecap="round" />

      <!-- Toe Highlights -->
      <ellipse cx="170" cy="466" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.35" />
      <ellipse cx="195" cy="456" rx="7" ry="2.5" fill="#FFFFFF" opacity="0.40" />
      <ellipse cx="220" cy="464" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.35" />

      <!-- Ground Contact Occlusion -->
      <path d="M 156 489 L 236 489" stroke="#120903" stroke-width="2" opacity="0.85" />
    </g>

    <!-- Right Foot -->
    <g id="right_foot">
      <!-- Inner Toe 1 -->
      <path d="M 276 468 C 276 456, 303 456, 303 468 L 304 490 L 276 490 Z" fill="url(#toeGradR)" />
      <!-- Middle Toe 2 -->
      <path d="M 302 462 C 302 448, 329 448, 329 462 L 330 491 L 302 491 Z" fill="url(#toeGradR)" />
      <!-- Outer Toe 3 -->
      <path d="M 328 472 C 328 460, 352 460, 352 472 L 353 490 L 328 490 Z" fill="url(#toeGradR)" />

      <!-- Toe Crevices (Ambient Shadows) -->
      <path d="M 303 466 L 303 490" stroke="#25170B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 329 466 L 329 490" stroke="#25170B" stroke-width="2.5" stroke-linecap="round" />

      <!-- Toe Highlights -->
      <ellipse cx="290" cy="464" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.35" />
      <ellipse cx="316" cy="456" rx="7" ry="2.5" fill="#FFFFFF" opacity="0.40" />
      <ellipse cx="340" cy="466" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.35" />

      <!-- Ground Contact Occlusion -->
      <path d="M 275 489 L 354 489" stroke="#120903" stroke-width="2" opacity="0.85" />
    </g>
  </g>
</svg>