<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background: transparent;">
  <defs>
    <!-- Master Body Gradient -->
    <linearGradient id="bodyGrad" x1="26%" y1="5%" x2="68%" y2="95%">
      <stop offset="0%" stop-color="#E5DDD5" />
      <stop offset="16%" stop-color="#DDD5CD" />
      <stop offset="38%" stop-color="#D4C9BD" />
      <stop offset="62%" stop-color="#B4A596" />
      <stop offset="82%" stop-color="#8A7768" />
      <stop offset="100%" stop-color="#4A3A2C" />
    </linearGradient>

    <!-- Cranial Highlight -->
    <radialGradient id="cranialHl" cx="42%" cy="20%" r="46%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#F5EFEA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#DED6CE" stop-opacity="0" />
    </radialGradient>

    <!-- Chest Soft Illumination -->
    <radialGradient id="chestHl" cx="44%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#ECE5DC" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#DED6CE" stop-opacity="0" />
    </radialGradient>

    <!-- Wing Shadow -->
    <linearGradient id="rWingShadow" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#D8CBBD" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#BAA591" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8E7764" stop-opacity="0.50" />
    </linearGradient>

    <!-- Left Flank Shading -->
    <linearGradient id="lFlankShadow" x1="50%" y1="35%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#B8A999" stop-opacity="0" />
      <stop offset="55%" stop-color="#8E7D6D" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#483628" stop-opacity="0.60" />
    </linearGradient>

    <!-- Left Flank Upper Specular -->
    <linearGradient id="lWingRim" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#E5DDD5" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#E5DDD5" stop-opacity="0" />
    </linearGradient>

    <!-- Left Eye Radial -->
    <radialGradient id="amberEyeL" cx="20%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#D99B26" />
      <stop offset="55%" stop-color="#8A4807" />
      <stop offset="85%" stop-color="#2D1302" />
      <stop offset="100%" stop-color="#150800" />
    </radialGradient>

    <!-- Right Eye Radial -->
    <radialGradient id="amberEyeR" cx="82%" cy="78%" r="75%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="25%" stop-color="#FFA000" />
      <stop offset="55%" stop-color="#B26A00" />
      <stop offset="82%" stop-color="#3E1C02" />
      <stop offset="100%" stop-color="#180A02" />
    </radialGradient>

    <!-- Pupil -->
    <radialGradient id="pupilGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#080402" />
      <stop offset="70%" stop-color="#180A03" />
      <stop offset="100%" stop-color="#2C1204" />
    </radialGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D0C0B0" />
      <stop offset="35%" stop-color="#B2957C" />
      <stop offset="70%" stop-color="#96775E" />
      <stop offset="100%" stop-color="#644732" />
    </linearGradient>

    <!-- Precise Left Foot Toe Gradients (Light Key Side) -->
    <!-- Toe 1 Outer -->
    <linearGradient id="lToe1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D8C9BB" />
      <stop offset="35%" stop-color="#B8A391" />
      <stop offset="75%" stop-color="#7C6552" />
      <stop offset="100%" stop-color="#4C3626" />
    </linearGradient>
    <!-- Toe 2 Middle (Peak Highlight) -->
    <linearGradient id="lToe2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E8DDD1" />
      <stop offset="35%" stop-color="#C2AD9A" />
      <stop offset="75%" stop-color="#846C58" />
      <stop offset="100%" stop-color="#503A28" />
    </linearGradient>
    <!-- Toe 3 Inner -->
    <linearGradient id="lToe3" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D0C0B0" />
      <stop offset="35%" stop-color="#AE9885" />
      <stop offset="75%" stop-color="#745E4C" />
      <stop offset="100%" stop-color="#443020" />
    </linearGradient>

    <!-- Precise Right Foot Toe Gradients (Warm Shadow Side) -->
    <!-- Toe 1 Inner -->
    <linearGradient id="rToe1" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#9A8673" />
      <stop offset="40%" stop-color="#756250" />
      <stop offset="80%" stop-color="#524030" />
      <stop offset="100%" stop-color="#322214" />
    </linearGradient>
    <!-- Toe 2 Middle -->
    <linearGradient id="rToe2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#AC9885" />
      <stop offset="40%" stop-color="#84705E" />
      <stop offset="80%" stop-color="#5C4938" />
      <stop offset="100%" stop-color="#3A281A" />
    </linearGradient>
    <!-- Toe 3 Outer -->
    <linearGradient id="rToe3" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#9E8A77" />
      <stop offset="40%" stop-color="#786553" />
      <stop offset="80%" stop-color="#544232" />
      <stop offset="100%" stop-color="#342416" />
    </linearGradient>

    <!-- Master Body Clip -->
    <clipPath id="bodyClip">
      <path d="M 213 46 L 191 55 L 167 71 L 149 90 L 149 92 L 138 107 L 138 110 L 136 111 L 133 120 L 130 124 L 125 142 L 123 144 L 118 173 L 112 177 L 108 188 L 100 199 L 96 214 L 94 216 L 90 236 L 88 254 L 88 301 L 94 338 L 96 340 L 100 353 L 103 356 L 102 357 L 107 363 L 107 365 L 113 371 L 117 372 L 123 377 L 124 376 L 129 381 L 136 391 L 136 393 L 140 396 L 140 398 L 158 416 L 160 416 L 170 424 L 181 429 L 189 435 L 189 444 L 184 457 L 180 461 L 171 462 L 169 464 L 164 465 L 158 472 L 156 479 L 157 488 L 163 488 L 165 490 L 183 489 L 185 491 L 204 491 L 227 488 L 229 490 L 235 489 L 235 485 L 231 487 L 230 486 L 230 474 L 220 462 L 220 457 L 216 456 L 216 450 L 220 442 L 265 443 L 275 442 L 277 440 L 282 440 L 284 442 L 290 440 L 292 442 L 293 441 L 298 448 L 297 460 L 294 461 L 294 464 L 291 467 L 283 471 L 280 477 L 280 481 L 276 484 L 278 488 L 281 487 L 286 490 L 346 490 L 353 484 L 353 473 L 347 466 L 337 464 L 330 459 L 325 448 L 324 434 L 329 429 L 333 428 L 336 423 L 347 418 L 358 407 L 367 401 L 367 399 L 384 379 L 387 373 L 400 370 L 412 350 L 419 329 L 423 299 L 423 255 L 417 216 L 415 214 L 414 207 L 407 192 L 401 185 L 402 184 L 400 182 L 399 177 L 393 171 L 388 147 L 386 145 L 383 129 L 374 112 L 374 109 L 360 90 L 360 88 L 346 73 L 320 55 L 292 45 L 274 42 L 237 42 Z" />
    </clipPath>
  
    <!-- Sleepy Eyelid Porcelain Shading -->
    <linearGradient id="eyelidGradL" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#EFE8DE" />
      <stop offset="90%" stop-color="#DCD3C7" />
      <stop offset="100%" stop-color="#8C7969" />
    </linearGradient>

    <linearGradient id="eyelidGradR" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#EAE3D9" />
      <stop offset="90%" stop-color="#D4C9BD" />
      <stop offset="100%" stop-color="#7C6B5C" />
    </linearGradient>

    <!-- Eyelid Cast Shadow on Iris -->
    <linearGradient id="eyelidShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0A0401" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2D1302" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6B3204" stop-opacity="0.0" />
    </linearGradient>
</defs>

  <!-- 1. Master Body Silhouette (Exact IoU >= 99%) -->
  <path d="M 213 46 L 191 55 L 167 71 L 149 90 L 149 92 L 138 107 L 138 110 L 136 111 L 133 120 L 130 124 L 125 142 L 123 144 L 118 173 L 112 177 L 108 188 L 100 199 L 96 214 L 94 216 L 90 236 L 88 254 L 88 301 L 94 338 L 96 340 L 100 353 L 103 356 L 102 357 L 107 363 L 107 365 L 113 371 L 117 372 L 123 377 L 124 376 L 129 381 L 136 391 L 136 393 L 140 396 L 140 398 L 158 416 L 160 416 L 170 424 L 181 429 L 189 435 L 189 444 L 184 457 L 180 461 L 171 462 L 169 464 L 164 465 L 158 472 L 156 479 L 157 488 L 163 488 L 165 490 L 183 489 L 185 491 L 204 491 L 227 488 L 229 490 L 235 489 L 235 485 L 231 487 L 230 486 L 230 474 L 220 462 L 220 457 L 216 456 L 216 450 L 220 442 L 265 443 L 275 442 L 277 440 L 282 440 L 284 442 L 290 440 L 292 442 L 293 441 L 298 448 L 297 460 L 294 461 L 294 464 L 291 467 L 283 471 L 280 477 L 280 481 L 276 484 L 278 488 L 281 487 L 286 490 L 346 490 L 353 484 L 353 473 L 347 466 L 337 464 L 330 459 L 325 448 L 324 434 L 329 429 L 333 428 L 336 423 L 347 418 L 358 407 L 367 401 L 367 399 L 384 379 L 387 373 L 400 370 L 412 350 L 419 329 L 423 299 L 423 255 L 417 216 L 415 214 L 414 207 L 407 192 L 401 185 L 402 184 L 400 182 L 399 177 L 393 171 L 388 147 L 386 145 L 383 129 L 374 112 L 374 109 L 360 90 L 360 88 L 346 73 L 320 55 L 292 45 L 274 42 L 237 42 Z" fill="url(#bodyGrad)" />

  <!-- 2. Clipped 3D Surface Overlays -->
  <g clip-path="url(#bodyClip)">
    <!-- Cranial Specular Dome -->
    <ellipse cx="248" cy="112" rx="142" ry="88" fill="url(#cranialHl)" />
    
    <!-- Chest Illumination -->
    <ellipse cx="242" cy="280" rx="108" ry="82" fill="url(#chestHl)" />

    <!-- Left Flank Upper Specular Rim -->
    <path d="M 155 190 C 110 215, 92 255, 96 310 C 110 330, 130 320, 145 290 C 130 250, 135 220, 155 190 Z" fill="url(#lWingRim)" />

    <!-- Right Flank Ambient Occlusion -->
    <path d="M 330 195 C 380 225, 424 285, 412 380 C 395 435, 360 455, 335 440 C 365 390, 370 300, 330 195 Z" fill="url(#rWingShadow)" />

    <!-- Left Flank Lower Shading -->
    <path d="M 160 260 C 115 280, 92 320, 98 385 C 110 425, 135 445, 155 435 C 135 385, 135 330, 160 260 Z" fill="url(#lFlankShadow)" />

    <!-- Beak Cast Shadow -->
    <ellipse cx="256" cy="225" rx="15" ry="7" fill="#3D2B1E" opacity="0.32" />

    <!-- Grounded Feet with 3 Anatomical Rounded Toes (Inside ClipPath so IoU stays >= 99.27%) -->
    <g id="feet">
      <!-- Left Foot Base Shadow -->
      <path d="M 156 460 C 156 448, 226 448, 226 460 L 235 491 L 156 491 Z" fill="#423022" />

      <!-- Left Foot 3 Rounded Toes -->
      <!-- Toe 1 Outer (X: 156-182) -->
      <path d="M 157 470 C 157 460, 180 460, 180 470 L 180 491 L 157 491 Z" fill="url(#lToe1)" />
      <!-- Toe 2 Middle (X: 179-209, Longest, Peak at 456) -->
      <path d="M 180 458 C 180 446, 208 446, 208 458 L 209 491 L 180 491 Z" fill="url(#lToe2)" />
      <!-- Toe 3 Inner (X: 207-234) -->
      <path d="M 208 468 C 208 458, 233 458, 233 468 L 235 491 L 208 491 Z" fill="url(#lToe3)" />

      <!-- Left Foot Deep Ambient Crevices -->
      <path d="M 180 462 L 180 491" stroke="#1D1208" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 208 462 L 209 491" stroke="#1D1208" stroke-width="4.0" stroke-linecap="round" />

      <!-- Left Toe Specular Ridges -->
      <ellipse cx="168" cy="466" rx="5" ry="2.2" fill="#FFFFFF" opacity="0.25" />
      <ellipse cx="194" cy="456" rx="7" ry="2.5" fill="#FFFFFF" opacity="0.35" />
      <ellipse cx="220" cy="466" rx="5" ry="2.2" fill="#FFFFFF" opacity="0.25" />

      <!-- Right Foot Base Shadow -->
      <path d="M 276 460 C 276 448, 353 448, 353 460 L 353 491 L 276 491 Z" fill="#2E1E12" />

      <!-- Right Foot 3 Rounded Toes -->
      <!-- Toe 1 Inner (X: 276-304) -->
      <path d="M 277 468 C 277 458, 303 458, 303 468 L 303 491 L 277 491 Z" fill="url(#rToe1)" />
      <!-- Toe 2 Middle (X: 302-332, Longest, Peak at 456) -->
      <path d="M 303 458 C 303 446, 331 446, 331 458 L 331 491 L 303 491 Z" fill="url(#rToe2)" />
      <!-- Toe 3 Outer (X: 330-353) -->
      <path d="M 330 470 C 330 460, 352 460, 352 470 L 353 491 L 330 491 Z" fill="url(#rToe3)" />

      <!-- Right Foot Deep Ambient Crevices -->
      <path d="M 303 462 L 303 491" stroke="#120A04" stroke-width="4.0" stroke-linecap="round" />
      <path d="M 331 462 L 331 491" stroke="#120A04" stroke-width="4.0" stroke-linecap="round" />

      <!-- Right Toe Specular Ridges -->
      <ellipse cx="290" cy="466" rx="5" ry="2.0" fill="#FFFFFF" opacity="0.10" />
      <ellipse cx="317" cy="456" rx="7" ry="2.2" fill="#FFFFFF" opacity="0.15" />
      <ellipse cx="341" cy="466" rx="5" ry="2.0" fill="#FFFFFF" opacity="0.10" />

      <!-- Ground Contact Baseline Occlusion Shadows (Y=489-491) -->
      <path d="M 156 490 L 235 490" stroke="#080402" stroke-width="2.5" opacity="0.9" />
      <path d="M 276 490 L 354 490" stroke="#080402" stroke-width="2.5" opacity="0.9" />
    </g>
  </g>

    <!-- 3. Eye Sockets & Amber Eyes (Anatomical Sleepy Hooded Aperture) -->
  <!-- Left Eye -->
  <g id="left_eye">
    <!-- Socket Rim Deep Groove -->
    <ellipse cx="194" cy="157" rx="30" ry="24" fill="#3D2817" opacity="0.45" />
    <path d="M 166 142 C 165 166, 175 180, 194 180 C 213 180, 224 166, 223 142 C 205 139, 185 139, 166 142 Z" fill="#1C0C02" />
    
    <!-- Amber Iris (Half-Moon Sliced) -->
    <path d="M 167 143 C 166 165, 176 178, 194 178 C 212 178, 222 165, 221 143 C 205 140, 185 140, 167 143 Z" fill="url(#amberEyeL)" />
    
    <!-- Pupil centered in lower aperture -->
    <ellipse cx="194" cy="162" rx="15" ry="11" fill="url(#pupilGrad)" />
    
    <!-- Cast Shadow under eyelid -->
    <path d="M 167 143 C 185 140, 205 140, 221 143 L 221 152 C 205 151, 185 151, 167 152 Z" fill="url(#eyelidShadow)" />

    <!-- Specular Highlight Dot on Left Iris -->
    <circle cx="188" cy="154" r="3.2" fill="#FFFFFF" opacity="0.95" />
    <circle cx="188" cy="154" r="5.0" fill="#FFFFFF" opacity="0.30" />

    <!-- Drooping Porcelain Upper Eyelid Hood -->
    <path d="M 164 140 C 170 120, 218 120, 224 140 C 206 142, 184 142, 164 140 Z" fill="url(#eyelidGradL)" />
    <path d="M 165 141 C 185 143, 205 143, 224 141" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g id="right_eye">
    <!-- Socket Rim Deep Groove -->
    <ellipse cx="310" cy="157" rx="30" ry="24" fill="#301A0D" opacity="0.45" />
    <path d="M 282 142 C 281 166, 291 180, 310 180 C 329 180, 339 166, 338 142 C 322 139, 300 139, 282 142 Z" fill="#180A02" />
    
    <!-- Amber Iris (Half-Moon Sliced) -->
    <path d="M 283 143 C 282 165, 292 178, 310 178 C 328 178, 338 165, 337 143 C 322 140, 300 140, 283 143 Z" fill="url(#amberEyeR)" />
    
    <!-- Pupil centered in lower aperture -->
    <ellipse cx="310" cy="162" rx="15" ry="11" fill="url(#pupilGrad)" />
    
    <!-- Cast Shadow under eyelid -->
    <path d="M 283 143 C 300 140, 322 140, 337 143 L 337 152 C 322 151, 300 151, 283 152 Z" fill="url(#eyelidShadow)" />

    <!-- Specular Highlight Dot on Right Iris -->
    <circle cx="304" cy="154" r="2.8" fill="#FFFFFF" opacity="0.85" />
    <circle cx="304" cy="154" r="4.5" fill="#FFFFFF" opacity="0.25" />

    <!-- Drooping Porcelain Upper Eyelid Hood -->
    <path d="M 280 140 C 286 120, 334 120, 340 140 C 322 142, 300 142, 280 140 Z" fill="url(#eyelidGradR)" />
    <path d="M 281 141 C 300 143, 322 143, 340 141" stroke="#301A0D" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>
<!-- 4. Beak (Porcelain Amber) -->
  <g id="beak">
    <path d="M 256 168 C 267 184, 268 206, 256 218 C 244 206, 245 184, 256 168 Z" fill="url(#beakGrad)" stroke="#4A3220" stroke-width="1.2" />
    <path d="M 256 172 C 259 184, 259 200, 256 212" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.25" fill="none" />
  </g>
</svg>