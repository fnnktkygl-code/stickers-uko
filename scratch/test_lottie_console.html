<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #0B0F17; }
    #lottie-container { width: 512px; height: 512px; }
  </style>
  <script src="/scratch/lottie.min.js"></script>
</head>
<body>
  <div id="lottie-container"></div>
  <script>
    fetch('/scratch/aituko_lottie_3d_master.json')
      .then(res => res.json())
      .then(animData => {
        window.anim = lottie.loadAnimation({
          container: document.getElementById('lottie-container'),
          renderer: 'svg',
          loop: false,
          autoplay: false,
          animationData: animData
        });
        window.anim.addEventListener('DOMLoaded', function() {
          window.anim.goToAndStop(0, true);
          console.log('DOMLoaded fired, elements:', document.querySelectorAll('svg g, svg image').length);
          // print out transforms of all image tags
          document.querySelectorAll('image').forEach(img => {
            console.log('IMG:', img.getAttribute('width'), img.getAttribute('height'), 'parent transform:', img.parentElement.getAttribute('transform'));
          });
        });
      });
  </script>
</body>
</html>
