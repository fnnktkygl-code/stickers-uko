<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background-color: #0B0F17; overflow: visible;">
  <defs>
    <!-- 1. Porcelain Cream Shading (Face, Chest, Belly, Paws) -->
    <radialGradient id="mw_creamBody" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FAF7F2" />
      <stop offset="70%" stop-color="#EFE8DC" />
      <stop offset="92%" stop-color="#DDCFBC" />
      <stop offset="100%" stop-color="#C8BAA6" />
    </radialGradient>

    <!-- 2. Rich Ginger / Apricot Coat (Ears, Crown, Hips, Tail) -->
    <radialGradient id="mw_gingerCoat" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="25%" stop-color="#FB923C" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>

    <!-- 3. Left Flank Ginger (Side Hip) -->
    <radialGradient id="mw_gingerFlankL" cx="30%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>

    <!-- 4. Right Flank Ginger (Side Hip) -->
    <radialGradient id="mw_gingerFlankR" cx="70%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>

    <!-- 5. Tail Cylindrical Gradient -->
    <linearGradient id="mw_tailGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="25%" stop-color="#C2410C" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <!-- 6. Inner Ear Peach/Pink Ceramic Recess -->
    <radialGradient id="mw_pinkEarL" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="40%" stop-color="#FED7AA" />
      <stop offset="75%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FB923C" />
    </radialGradient>
    <radialGradient id="mw_pinkEarR" cx="55%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="40%" stop-color="#FED7AA" />
      <stop offset="75%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FB923C" />
    </radialGradient>

    <!-- 7. Glassy Amber Orb Eye (Left) -->
    <radialGradient id="mw_amberEyeL" cx="40%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <!-- 8. Glassy Amber Orb Eye (Right) -->
    <radialGradient id="mw_amberEyeR" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <!-- 9. Specular Glaze Highlights -->
    <radialGradient id="mw_specularDome" cx="45%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>

    <!-- 10. Chest Specular Glaze -->
    <radialGradient id="mw_specularChest" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>

    <style>
      
      @keyframes meowekoBreathe {
        0%, 100% { transform: translateY(0px) scale(1.0, 1.0); }
        25% { transform: translateY(3.5px) scale(1.012, 0.988); }
        50% { transform: translateY(0px) scale(1.0, 1.0); }
        75% { transform: translateY(-3.5px) scale(0.988, 1.012); }
      }

      @keyframes meowekoTailSwish {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4.0deg); }
        50% { transform: rotate(0deg); }
        75% { transform: rotate(4.0deg); }
      }

      @keyframes meowekoBlink {
        0%, 16%, 26%, 66%, 76%, 100% { transform: scaleY(0); }
        19%, 23%, 69%, 73% { transform: scaleY(1); }
      }

      @keyframes meowekoEarTwitch {
        0%, 38%, 48%, 100% { transform: rotate(0deg); }
        41% { transform: rotate(-3.0deg); }
        44% { transform: rotate(2.5deg); }
      }

      .breathe-group {
        animation: meowekoBreathe 4s ease-in-out infinite;
      }
      .tail-group {
        transform-origin: 185px 445px;
        animation: meowekoTailSwish 4s ease-in-out infinite;
      }
      .eyelid-l {
        transform-origin: 202px 178px;
        animation: meowekoBlink 4s ease-in-out infinite;
      }
      .eyelid-r {
        transform-origin: 298px 180px;
        animation: meowekoBlink 4s ease-in-out infinite;
      }
      .ears-group {
        transform-origin: 256px 140px;
        animation: meowekoEarTwitch 4s ease-in-out infinite;
      }
    
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- LAYER 1: FELINE TAIL (BEHIND LEFT FLANK)                          -->
  <!-- ================================================================= -->
  <g class="tail-group">
    <!-- Tail Spline curving outwards to the left -->
    <path d="M 188 442 C 145 440 98 446 86 422 C 78 406 88 392 108 396 C 132 400 156 420 182 432 Z"
          fill="url(#mw_tailGrad)" stroke="#9A3412" stroke-width="0.8" />
  </g>

  <!-- ================================================================= -->
  <!-- LAYER 2: GINGER FLANKS & HIPS (BACKGROUND OF TORSO)              -->
  <!-- ================================================================= -->
  <!-- Left Ginger Flank / Thigh -->
  <path d="M 195 332 C 160 352 136 395 138 438 C 140 458 152 472 178 476 C 198 479 216 468 222 448 C 220 405 210 365 195 332 Z"
        fill="url(#mw_gingerFlankL)" stroke="#9A3412" stroke-width="0.8" />

  <!-- Right Ginger Flank / Thigh -->
  <path d="M 315 332 C 348 352 384 395 382 438 C 380 458 368 472 342 476 C 322 479 308 468 302 448 C 305 405 310 365 315 332 Z"
        fill="url(#mw_gingerFlankR)" stroke="#9A3412" stroke-width="0.8" />

  <!-- ================================================================= -->
  <!-- LAYER 3: BREATHING TORSO, CHEST, FORELEGS & HEAD                 -->
  <!-- ================================================================= -->
  <g class="breathe-group">

    <!-- 3A. Central Cream-White Torso Capsule & Forelegs -->
    <path d="M 235 272 C 210 305 198 355 200 405 C 202 438 206 465 214 476 C 224 478 238 478 248 476 C 254 445 255 385 256 360 C 257 385 258 445 264 476 C 274 478 288 478 298 476 C 306 465 310 438 312 405 C 314 355 302 305 277 272 Z"
          fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />

    <!-- Chest Specular Reflection -->
    <ellipse cx="256" cy="340" rx="38" ry="55" fill="url(#mw_specularChest)" />

    <!-- Subtle leg crease shadow between forelegs -->
    <path d="M 256 375 L 256 470" stroke="#C8BAA6" stroke-width="1.0" stroke-linecap="round" opacity="0.6" />

    <!-- 3B. Sculpted Front Paws (Resting on baseline Y = 491 px, 0 shadow below) -->
    <!-- Left Paw with 3 distinct rounded toe pads -->
    <g id="paw_left">
      <!-- Toe 1 (inner) -->
      <ellipse cx="225" cy="482" rx="9" ry="8.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Toe 2 (middle) -->
      <ellipse cx="238" cy="483" rx="9" ry="8" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Toe 3 (outer) -->
      <ellipse cx="250" cy="482" rx="8.5" ry="7.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Crease accents -->
      <path d="M 231 476 L 232 489" stroke="#B8A894" stroke-width="0.7" />
      <path d="M 244 476 L 244 489" stroke="#B8A894" stroke-width="0.7" />
    </g>

    <!-- Right Paw with 3 distinct rounded toe pads -->
    <g id="paw_right">
      <!-- Toe 1 (inner) -->
      <ellipse cx="262" cy="482" rx="8.5" ry="7.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Toe 2 (middle) -->
      <ellipse cx="274" cy="483" rx="9" ry="8" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Toe 3 (outer) -->
      <ellipse cx="287" cy="482" rx="9" ry="8.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
      <!-- Crease accents -->
      <path d="M 268 476 L 268 489" stroke="#B8A894" stroke-width="0.7" />
      <path d="M 280 476 L 281 489" stroke="#B8A894" stroke-width="0.7" />
    </g>

    <!-- =============================================================== -->
    <!-- 3C. HEAD DOME, EARS & FACIAL ANATOMY                             -->
    <!-- =============================================================== -->
    <g class="ears-group">
      <!-- EARS: GINGER PORCELAIN OUTER SHELLS -->
      <!-- Left Ear Outer -->
      <path d="M 156 160 C 150 135 158 85 174 48 C 180 36 190 38 196 52 C 212 90 228 125 238 142 Z"
            fill="url(#mw_gingerCoat)" stroke="#9A3412" stroke-width="0.8" />

      <!-- Left Ear Inner Peach Recess -->
      <path d="M 168 150 C 165 130 172 90 182 62 C 186 52 192 56 195 66 C 205 95 215 125 224 138 Z"
            fill="url(#mw_pinkEarL)" stroke="#EA580C" stroke-width="0.6" />
      <!-- Inner ear specular ridge -->
      <path d="M 174 135 C 172 105 178 78 184 66" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none" />

      <!-- Right Ear Outer -->
      <path d="M 276 142 C 286 125 302 90 318 52 C 324 38 334 36 340 48 C 356 85 364 135 358 160 Z"
            fill="url(#mw_gingerCoat)" stroke="#9A3412" stroke-width="0.8" />

      <!-- Right Ear Inner Peach Recess -->
      <path d="M 290 138 C 298 125 308 95 318 66 C 322 56 328 52 331 62 C 340 90 348 130 344 150 Z"
            fill="url(#mw_pinkEarR)" stroke="#EA580C" stroke-width="0.6" />
      <!-- Inner ear specular ridge -->
      <path d="M 338 135 C 340 105 334 78 328 66" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none" />
    </g>

    <!-- HEAD DOME: BASE OBLATE PORCELAIN -->
    <ellipse cx="256" cy="195" rx="108" ry="92" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />

    <!-- GINGER COAT CAP ON HEAD (Crown & Temples parted by Cream Forehead Blaze) -->
    <!-- Left Ginger Cap -->
    <path d="M 152 185 C 148 150 160 115 185 88 C 210 65 235 60 244 60 C 242 90 236 125 220 152 C 205 175 180 188 152 185 Z"
          fill="url(#mw_gingerCoat)" opacity="0.95" />

    <!-- Right Ginger Cap -->
    <path d="M 360 185 C 364 150 352 115 327 88 C 302 65 277 60 268 60 C 270 90 276 125 292 152 C 307 175 332 188 360 185 Z"
          fill="url(#mw_gingerCoat)" opacity="0.95" />

    <!-- Head Dome Specular Highlight -->
    <ellipse cx="256" cy="145" rx="72" ry="42" fill="url(#mw_specularDome)" />

    <!-- CHUBBY CHEEKS & MUZZLE (Cream White Porcelain Overlay in Front) -->
    <path d="M 172 205 C 160 235 175 272 210 285 C 235 292 277 292 302 285 C 337 272 352 235 340 205 C 325 185 295 175 256 175 C 217 175 187 185 172 205 Z"
          fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />

    <!-- Cheek Specular Highlights -->
    <ellipse cx="195" cy="245" rx="24" ry="18" fill="url(#mw_specularDome)" opacity="0.6" />
    <ellipse cx="317" cy="245" rx="24" ry="18" fill="url(#mw_specularDome)" opacity="0.6" />

    <!-- =============================================================== -->
    <!-- 3D. GLASSY AMBER ORB EYES WITH SPECULAR HIGHLIGHTS               -->
    <!-- =============================================================== -->
    <!-- Left Eye Socket Eyeliner -->
    <ellipse cx="204" cy="204" rx="27" ry="30" fill="#3B1804" />
    <!-- Left Amber Glass Orb -->
    <ellipse cx="204" cy="204" rx="25" ry="28" fill="url(#mw_amberEyeL)" />
    <!-- Left Pupil Core -->
    <ellipse cx="204" cy="204" rx="10" ry="15" fill="#260E02" opacity="0.75" />
    <!-- Left Crisp Primary Specular Reflection -->
    <circle cx="213" cy="194" r="5.5" fill="#FFFFFF" />
    <!-- Left Secondary Ambient Reflection -->
    <circle cx="197" cy="216" r="2.5" fill="#FFFFFF" opacity="0.45" />

    <!-- Right Eye Socket Eyeliner -->
    <ellipse cx="296" cy="204" rx="26" ry="29" fill="#3B1804" />
    <!-- Right Amber Glass Orb -->
    <ellipse cx="296" cy="204" rx="24" ry="27" fill="url(#mw_amberEyeR)" />
    <!-- Right Pupil Core -->
    <ellipse cx="296" cy="204" rx="9.5" ry="14" fill="#260E02" opacity="0.75" />
    <!-- Right Crisp Primary Specular Reflection -->
    <circle cx="304" cy="194" r="5.0" fill="#FFFFFF" />
    <!-- Right Secondary Ambient Reflection -->
    <circle cx="290" cy="216" r="2.5" fill="#FFFFFF" opacity="0.45" />

    <!-- PORCELAIN EYELIDS (DOUBLE BLINK ANIMATED OVER EYES) -->
    <g class="eyelid-l">
      <ellipse cx="204" cy="204" rx="27.5" ry="30.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
    </g>
    <g class="eyelid-r">
      <ellipse cx="296" cy="204" rx="26.5" ry="29.5" fill="url(#mw_creamBody)" stroke="#C8BAA6" stroke-width="0.8" />
    </g>

    <!-- =============================================================== -->
    <!-- 3E. NOSE, MOUTH & DELICATE WHISKERS                             -->
    <!-- =============================================================== -->
    <!-- Soft Peach/Coral Inverted Triangular Nose -->
    <polygon points="256,238 250,230 262,230" fill="#FB923C" stroke="#EA580C" stroke-width="0.5" />
    <!-- Nose Specular Highlight -->
    <ellipse cx="256" cy="232" rx="3.5" ry="1.5" fill="#FED7AA" />

    <!-- Delicate Feline Philtrum & Mouth Line -->
    <path d="M 256 238 L 256 244 C 253 248 247 249 243 246" fill="none" stroke="#A89F91" stroke-width="0.9" stroke-linecap="round" />
    <path d="M 256 244 C 259 248 265 249 269 246" fill="none" stroke="#A89F91" stroke-width="0.9" stroke-linecap="round" />

    <!-- Delicate Whisker Accents -->
    <g stroke="#CBD5E1" stroke-width="0.7" opacity="0.6" stroke-linecap="round">
      <!-- Left Whiskers -->
      <line x1="180" y1="242" x2="115" y2="236" />
      <line x1="180" y1="248" x2="112" y2="252" />
      <!-- Right Whiskers -->
      <line x1="332" y1="242" x2="397" y2="236" />
      <line x1="332" y1="248" x2="400" y2="252" />
    </g>
  </g>
</svg>