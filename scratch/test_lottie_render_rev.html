<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #0B0F17; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #lottie-container { width: 512px; height: 512px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
  <div id="lottie-container"></div>
  <script>
    fetch('/scratch/test_lottie_reversed.json')
      .then(res => res.json())
      .then(animationData => {
        window.anim = lottie.loadAnimation({
          container: document.getElementById('lottie-container'),
          renderer: 'svg',
          loop: false,
          autoplay: false,
          animationData: animationData
        });
        window.anim.goToAndStop(0, true);
      });
  </script>
</body>
</html>
