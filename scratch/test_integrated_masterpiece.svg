    <!-- Right Porcelain Eyelid Hood -->
    <linearGradient id="eyelidHoodR" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EFE0D2" />
      <stop offset="45%" stop-color="#DCBEAA" />
      <stop offset="75%" stop-color="#BF9E88" />
      <stop offset="100%" stop-color="#A5846E" />
