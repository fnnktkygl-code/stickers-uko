    <!-- Left Amber Iris -->
    <linearGradient id="amberEyeL" x1="40%" y1="10%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#4E280C" />
      <stop offset="38%" stop-color="#6B3A12" />
      <stop offset="68%" stop-color="#B87D2A" />
      <stop offset="88%" stop-color="#EAA648" />
      <stop offset="100%" stop-color="#D48E32" />
