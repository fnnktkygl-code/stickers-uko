    <!-- Right Amber Iris (Angled towards lower right illuminated caustic) -->
    <linearGradient id="amberEyeR" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#3D1D06" />
      <stop offset="30%" stop-color="#552C0D" />
      <stop offset="55%" stop-color="#8A541A" />
      <stop offset="80%" stop-color="#C88226" />
      <stop offset="100%" stop-color="#E29A32" />
