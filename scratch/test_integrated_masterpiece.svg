    <!-- Feet 3D Modeling (Seamless Organic Avian Feet) -->
    <!-- Left Foot Whole Organic Mesh -->
    <path d="M 155 479 L 157 485 L 160 488 L 169 489 L 176 485 L 180 485 L 186 489 L 198 489 L 206 485 L 214 485 L 220 489 L 228 488 L 231 486 L 233 482 L 231 469 L 227 465 L 225 465 L 219 458 L 217 451 L 217 447 L 221 442 L 224 441 L 239 442 L 239 435 L 191 435 L 192 439 L 190 442 L 190 445 L 185 457 L 178 462 L 174 462 L 171 464 L 167 464 L 162 466 L 158 470 Z" fill="url(#lFootGrad)" />
    <!-- Left Foot Knuckle Highlights -->
    <ellipse cx="164" cy="476" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.22" />
    <ellipse cx="189" cy="469" rx="8.5" ry="5.5" fill="#FFFFFF" opacity="0.26" />
    <ellipse cx="220" cy="476" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.20" />
    <!-- Left Foot Soft Crevices -->
    <ellipse cx="179" cy="475" rx="2.5" ry="9" fill="#2D1B0E" opacity="0.22" />
    <ellipse cx="206" cy="473" rx="2.5" ry="9" fill="#2D1B0E" opacity="0.22" />

    <!-- Right Foot Whole Organic Mesh -->
    <path d="M 270 435 L 270 442 L 293 441 L 297 446 L 297 455 L 293 461 L 283 470 L 280 476 L 280 484 L 283 488 L 293 489 L 300 485 L 308 485 L 314 489 L 324 489 L 329 485 L 337 485 L 340 487 L 349 488 L 352 487 L 356 483 L 356 474 L 353 468 L 351 466 L 338 462 L 332 459 L 329 456 L 323 442 L 323 435 Z" fill="url(#rFootGrad)" />
    <!-- Right Foot Knuckle Highlights -->
    <ellipse cx="288" cy="476" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.18" />
    <ellipse cx="315" cy="469" rx="8.5" ry="5.5" fill="#FFFFFF" opacity="0.22" />
    <ellipse cx="345" cy="476" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.16" />
    <!-- Right Foot Soft Crevices -->
    <ellipse cx="304" cy="473" rx="2.5" ry="9" fill="#25160A" opacity="0.22" />
    <ellipse cx="330" cy="475" rx="2.5" ry="9" fill="#25160A" opacity="0.22" />
  </g>

    <!-- 3. Inner Orbit Warm Crevice (Warm volumetric shading between beak & right eye, zero cranial dome smudge) -->
  <ellipse cx="272" cy="168" rx="14" ry="20" fill="url(#orbitGrooveR)" />

  <!-- 4. Sleepy Hooded Glassy Amber Eyes (Relaxed Symmetrical Hoods & Caustics) -->
  <!-- Left Eye -->
  <g id="left_eye">
    <!-- Amber Iris (Relaxed horizontal top Y=140.5..143, vertical lateral walls Y=142..158, rounded circular bottom bowl to Y=180) -->
    <path d="M 168.5 142 C 167 150, 167 158, 172 166 C 178 174, 186 179.5, 195.5 179.5 C 205 179.5, 213 174, 219 166 C 223 158, 223 150, 223 143 C 210 140.5, 180 140.5, 168.5 142 Z" fill="url(#amberEyeL)" />
    <!-- Pupil -->
    <ellipse cx="196" cy="154" rx="14" ry="12" fill="url(#pupilGradL)" />
    <!-- Lower Golden Luminous Rim -->
    <path d="M 175 168 C 182 176, 194 178.5, 206 177.5 C 214 176, 220 170, 222 165 C 218 171, 208 175.5, 196 175.5 C 185 175.5, 179 171, 175 168 Z" fill="#FFE294" opacity="0.68" />
    <!-- Eyelid Cast Shadow on eyeball -->
    <path d="M 169 142 L 169 148 C 180 146, 210 146, 223 149 L 223 143 C 210 140.5, 180 140.5, 169 142 Z" fill="url(#eyeShadow)" />
    
    <!-- Specular Reflection Glint (Calibrated to Ref X=185.5, Y=142.5) -->
    <ellipse cx="185.5" cy="142.5" rx="2.5" ry="2.0" fill="#FFFFFF" opacity="0.95" />
    <ellipse cx="185.5" cy="142.5" rx="4.2" ry="3.2" fill="#FFF8E0" opacity="0.40" />

    <!-- Porcelain Upper Eyelid Hood (Gentle Arched Crease) -->
    <path d="M 167 140 C 172 118, 218 118, 224 143 C 210 140.5, 180 140.5, 167 140 Z" fill="url(#eyelidHoodL)" />
    <!-- Eyelid Lower Porcelain Edge Highlight -->
    <path d="M 168 141.8 C 180 140.2, 210 140.2, 223.5 142.8" stroke="#FFFDF8" stroke-width="1.0" stroke-linecap="round" opacity="0.55" fill="none" />
  </g>

  <!-- Right Eye -->
  <g id="right_eye">
    <!-- Amber Iris (Relaxed horizontal top Y=140.5..143, vertical lateral walls Y=143..158, rounded circular bottom bowl to Y=180) -->
    <path d="M 281 143.5 C 281 150, 281 158, 285 166 C 291 174, 299 179.5, 310.5 179.5 C 319 179.5, 327 174, 333 166 C 338 158, 338 150, 339.5 142 C 326 140.5, 296 140.5, 281 143.5 Z" fill="url(#amberEyeR)" />
    <!-- Pupil -->
    <ellipse cx="310" cy="153" rx="13.5" ry="11.5" fill="url(#pupilGradR)" />
    <!-- Lower Golden Luminous Rim -->
    <path d="M 302 173 C 310 177.5, 322 177.5, 332 172.5 C 336 168, 338 162, 339 157 C 336 163, 329 169, 320 171 C 312 171, 306 171, 302 173 Z" fill="#E59E38" opacity="0.60" />
    <ellipse cx="326" cy="165" rx="4.0" ry="3.5" fill="#FFAE20" opacity="0.72" /><ellipse cx="326" cy="165" rx="2.2" ry="1.8" fill="#FFD870" opacity="0.80" />

    <!-- Eyelid Cast Shadow -->
    <path d="M 281 144 L 281 149 C 296 146, 326 146, 340 149 L 340 143 C 326 140.5, 296 140.5, 281 144 Z" fill="url(#eyeShadow)" />

    <!-- Specular Highlight Glint (Top rim) -->
    <ellipse cx="303" cy="142.0" rx="2.2" ry="1.8" fill="#FFE8C2" opacity="0.72" />

    <!-- Porcelain Upper Eyelid Hood -->
    <path d="M 277 143 C 285 118, 335 118, 341 142 C 326 140.5, 296 140.5, 277 143 Z" fill="url(#eyelidHoodR)" />
    <!-- Eyelid Lower Porcelain Edge Highlight -->
    <path d="M 278 143 C 294 140.2, 326 140.2, 340 142.5" stroke="#F6ECE0" stroke-width="1.0" stroke-linecap="round" opacity="0.50" fill="none" />
  </g>

  <!-- 5. Plump Rounded 3D Porcelain Beak Cone (Width ~22px, Height ~37px, nested comfortably between lower half of eyes) -->
  <g id="beak">
    <!-- Soft Beak Right Ambient Cast Shadow onto face -->
    <path d="M 256 160 C 263 172, 269 184, 269 196 C 269 203, 265 208, 256 208 C 262 204, 264 198, 264 190 C 264 180, 260 170, 256 160 Z" fill="#6E533F" opacity="0.35" />
    <!-- Cast Shadow beneath beak tip onto breast -->
    <ellipse cx="255" cy="206.5" rx="14" ry="5.5" fill="url(#beakTipShadow)" />
    <!-- Plump Volumetric Pear/Cone Beak Body -->
    <path d="M 252 150 C 248 165, 243.5 178, 243.5 188 C 243.5 197, 248 204.5, 254.5 204.5 C 261.5 204.5, 266.5 197, 266.5 188 C 266.5 178, 261 165, 257 150 C 255 149, 254 149, 252 150 Z" fill="url(#beakGrad)" />
    <!-- Longitudinal Soft Volumetric Highlight Ridge -->
    <path d="M 251 156 C 248.5 169, 247.5 182, 249.5 196" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" opacity="0.28" fill="none" />
    <!-- Soft Apex Volume Highlight -->
    <ellipse cx="251" cy="184" rx="3.2" ry="6.5" fill="#FFFFFF" opacity="0.18" />
  </g>
</svg>