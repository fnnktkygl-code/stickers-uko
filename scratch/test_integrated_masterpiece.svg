    <!-- Left Porcelain Eyelid Hood -->
    <linearGradient id="eyelidHoodL" x1="35%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4" />
      <stop offset="50%" stop-color="#F4E7DC" />
      <stop offset="80%" stop-color="#DCBEA8" />
      <stop offset="100%" stop-color="#C2A28C" />
