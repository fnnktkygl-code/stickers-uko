    <ellipse cx="323" cy="466" rx="8.5" ry="5.5" fill="#FFFFFF" opacity="0.25" />
    <ellipse cx="346" cy="472" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.18" />
