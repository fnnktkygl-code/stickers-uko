<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>body { margin:0; background:#0B0F17; width:512px; height:512px; overflow:hidden; }</style>
</head>
<body>
<div id="anim" style="width:512px;height:512px;"></div>
<script>
fetch('test_lottie_prec1.json')
  .then(r => r.json())
  .then(data => {
    window.anim = lottie.loadAnimation({
      container: document.getElementById('anim'),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: data
    });
    window.anim.addEventListener('DOMLoaded', () => {
      window.anim.goToAndStop(60, true);
      window.rendered = true;
    });
  });
</script>
</body>
</html>
