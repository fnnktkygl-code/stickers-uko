    </linearGradient>
    <!-- Soft crevice shadow gradient -->
    <radialGradient id="creviceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B0E" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#2D1B0E" stop-opacity="0.18000000000000002" />
