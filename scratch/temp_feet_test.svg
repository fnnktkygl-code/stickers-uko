<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 435 210 60" width="210" height="60" style="background: transparent;">
  <defs>
    <linearGradient id="lFoot" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D4C0AF" /><stop offset="45%" stop-color="#A89381" /><stop offset="85%" stop-color="#6B5442" /><stop offset="100%" stop-color="#483526" />
    </linearGradient>
    <linearGradient id="rFoot" x1="30%" y1="0%" x2="70%" y2="100%">
