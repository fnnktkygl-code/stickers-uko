<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="background: transparent;">
  <defs>
    <!-- Studio Porcelaine Étalonnée -->
    <linearGradient id="bodyGrad" x1="30%" y1="5%" x2="70%" y2="95%">
      <stop offset="0%" stop-color="#DED6CE" />
      <stop offset="20%" stop-color="#DDD5CD" />
      <stop offset="45%" stop-color="#D4C9BD" />
      <stop offset="65%" stop-color="#BAABA0" />
      <stop offset="85%" stop-color="#9E8C7F" />
      <stop offset="100%" stop-color="#736151" />
    </linearGradient>

    <!-- Cranial Highlight -->
    <radialGradient id="cranialHl" cx="45%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#F4EFEA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#DED6CE" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Eye Radial -->
    <radialGradient id="amberEye" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#D99B26" />
      <stop offset="65%" stop-color="#8A4807" />
      <stop offset="90%" stop-color="#2D1302" />
      <stop offset="100%" stop-color="#150800" />
    </radialGradient>

    <!-- Pupil -->
    <radialGradient id="pupilGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#080402" />
      <stop offset="80%" stop-color="#180A03" />
      <stop offset="100%" stop-color="#301505" />
    </radialGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E2C7B0" />
      <stop offset="50%" stop-color="#B89578" />
      <stop offset="100%" stop-color="#7D5A40" />
    </linearGradient>

    <!-- Right Wing Shadow -->
    <linearGradient id="rWingShadow" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C5B8AC" />
      <stop offset="60%" stop-color="#8E7E70" />
      <stop offset="100%" stop-color="#5D4D40" />
    </linearGradient>
  </defs>

  <!-- 1. Master Body Silhouette with Calibrated Studio Shading -->
  <path d="M 213 46 L 191 55 L 167 71 L 149 90 L 149 92 L 138 107 L 138 110 L 136 111 L 133 120 L 130 124 L 125 142 L 123 144 L 118 173 L 112 177 L 108 188 L 100 199 L 96 214 L 94 216 L 90 236 L 88 254 L 88 301 L 94 338 L 96 340 L 100 353 L 103 356 L 102 357 L 107 363 L 107 365 L 113 371 L 117 372 L 123 377 L 124 376 L 129 381 L 136 391 L 136 393 L 140 396 L 140 398 L 158 416 L 160 416 L 170 424 L 181 429 L 189 435 L 189 444 L 184 457 L 180 461 L 171 462 L 169 464 L 164 465 L 158 472 L 156 479 L 157 488 L 163 488 L 165 490 L 183 489 L 185 491 L 204 491 L 227 488 L 229 490 L 235 489 L 235 485 L 231 487 L 230 486 L 230 474 L 220 462 L 220 457 L 216 456 L 216 450 L 220 442 L 265 443 L 275 442 L 277 440 L 282 440 L 284 442 L 290 440 L 292 442 L 293 441 L 298 448 L 297 460 L 294 461 L 294 464 L 291 467 L 283 471 L 280 477 L 280 481 L 276 484 L 278 488 L 281 487 L 286 490 L 346 490 L 353 484 L 353 473 L 347 466 L 337 464 L 330 459 L 325 448 L 324 434 L 329 429 L 333 428 L 336 423 L 347 418 L 358 407 L 367 401 L 367 399 L 384 379 L 387 373 L 400 370 L 412 350 L 419 329 L 423 299 L 423 255 L 417 216 L 415 214 L 414 207 L 407 192 L 401 185 L 402 184 L 400 182 L 399 177 L 393 171 L 388 147 L 386 145 L 383 129 L 374 112 L 374 109 L 360 90 L 360 88 L 346 73 L 320 55 L 292 45 L 274 42 L 237 42 Z" fill="url(#bodyGrad)" />

  <!-- 2. Cranial Specular Dome -->
  <ellipse cx="256" cy="140" rx="140" ry="100" fill="url(#cranialHl)" />

  <!-- 3. Right Flank / Wing Ambient Occlusion Overlay -->
  <path d="M 350 210 C 400 240, 424 300, 410 390 C 390 440, 360 450, 340 430 C 365 380, 370 300, 350 210 Z" fill="url(#rWingShadow)" opacity="0.75" />

  <!-- 4. Left Flank Highlight -->
  <path d="M 160 210 C 110 240, 90 300, 100 390 C 115 430, 140 440, 160 420 C 145 370, 140 290, 160 210 Z" fill="#E5DDD5" opacity="0.45" />

  <!-- 5. Eyes: Calibrated Positions -->
  <!-- Left Eye -->
  <g id="left_eye">
    <circle cx="195" cy="160" r="28.5" fill="url(#amberEye)" stroke="#1F0D02" stroke-width="2" />
    <circle cx="197" cy="161" r="14" fill="url(#pupilGrad)" />
    <circle cx="187" cy="150" r="4.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="205" cy="168" r="2" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Right Eye -->
  <g id="right_eye">
    <circle cx="309" cy="145" r="32.5" fill="url(#amberEye)" stroke="#1F0D02" stroke-width="2" />
    <circle cx="307" cy="146" r="16" fill="url(#pupilGrad)" />
    <circle cx="299" cy="135" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="320" cy="153" r="2.5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 6. Beak -->
  <path d="M 256 168 C 265 185, 264 210, 256 220 C 248 210, 247 185, 256 168 Z" fill="url(#beakGrad)" stroke="#5C3D25" stroke-width="1.2" />
</svg>