    <linearGradient id="eyelidHoodL" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4" />
      <stop offset="55%" stop-color="#F4E7DC" />
      <stop offset="85%" stop-color="#DCBEA8" />
      <stop offset="100%" stop-color="#70441D" />
