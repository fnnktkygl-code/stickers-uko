    <radialGradient id="beakTipShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B503D" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6B503D" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6B503D" stop-opacity="0" />
